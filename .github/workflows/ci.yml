# CI — runs on every push & PR.
# Validates the three layers of the stack:
#   - backend: ./mvnw test (Java 17)
#   - frontend: npm ci + build (Node 18)  — catches Vue regressions, missing imports
#   - ml service: pip install (Python 3.12) — catches torch/fastapi version drift
#
# The legacy maven-publish.yml was a template for publishing the JAR to
# GitHub Packages, but OncoVision is a full-stack app (not a library) and
# has no <distributionManagement>. CI replaces it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build & test
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  ml-service:
    name: ML service (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/service/requirements.txt
      - name: Install
        run: pip install -r service/requirements.txt
      - name: Import smoke test
        run: |
          python -c "import fastapi, torch, torchvision, PIL; print('imports ok')"
