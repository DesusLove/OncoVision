# Activate with: SPRING_PROFILES_ACTIVE=mysql ./mvnw spring-boot:run
# Required env vars: DB_URL, DB_USER, DB_PASSWORD.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/patientdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console only runs in the dev profile; do NOT enable here.
spring.h2.console.enabled=false
