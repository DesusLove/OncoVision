# Profile is fixed to `h2` (dev). Switch to `mysql` for production:
#   SPRING_PROFILES_ACTIVE=mysql ./mvnw spring-boot:run
# The MySQL-specific settings live in application-mysql.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# === H2 file-backed database (dev profile) ===
# Data persists across backend restarts. The file lives under ./data/ so it
# sits alongside the project (gitignored). Set ONCOVISION_DB=jdbc:h2:mem:patientdb
# to force the old in-memory behaviour if needed.
spring.datasource.url=${ONCOVISION_DB:jdbc:h2:file:./data/patientdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ML service URL (not running, diagnosis endpoints will return 502)
# Set ONCOVISION_ML_URL to point at a running Python ML service.
ml.service.url=${ONCOVISION_ML_URL:http://localhost:8000}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port
server.port=8080
