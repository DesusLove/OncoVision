# Profile is fixed to `h2` (dev). Switch to `mysql` for production:
#   SPRING_PROFILES_ACTIVE=mysql ./mvnw spring-boot:run
# The MySQL-specific settings live in application-mysql.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# === H2 in-memory database (dev profile) ===
spring.datasource.url=jdbc:h2:mem:patientdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ML service URL (not running, diagnosis endpoints will return 502)
ml.service.url=http://localhost:8000

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port
server.port=8080
